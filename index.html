<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#26364a">
  <title>SAO Workplace V2.2 • Home • Clinic • Study • AI</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css?v=2.2.0">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="logo">S</div><div><strong>SAO Workplace</strong><span>Office & Home</span></div></div>
    <nav id="nav">
      <button class="active" data-view="dashboard">⌂ Dashboard</button>
      <button data-view="myday">☀ My Day</button>
      <button data-view="tasks">✓ Tasks & Projects</button>
      <button data-view="board">▦ Status Board</button>
      <button data-view="study">📚 Study Planner</button>
      <button data-view="wellness">🧘 Wellness & Sadhana</button>
      <button data-view="travel">✈ Travel & Seminar</button>
      <button data-view="review">↻ Review Center</button>
      <button data-view="summary">▤ Master Summary</button>
      <button data-view="files">📎 Files & Notes</button>
      <button data-view="backup">⤓ Backup / Restore</button>
      <button data-view="settings">⚙ Settings</button>
    </nav>
    <div class="side-note">Capture first. Prioritize second. Review regularly.</div>
  </aside>
  <main class="main">
    <header class="topbar"><div><h1 id="pageTitle">Dashboard</h1><p id="pageSubtitle">Your work, study, health, family and life responsibilities in one place.</p></div><div class="top-actions"><input id="globalSearch" placeholder="Search anything…"><button id="quickAddBtn">+ Quick Add</button></div></header>
    <section id="view"></section>
  </main>
</div>
<div id="modal" class="modal"><div class="modal-card"><div class="modal-head"><div><span class="eyebrow">QUICK CAPTURE</span><h3>Write it before you forget it</h3></div><button id="closeModal" class="ghost">✕</button></div><div class="formgrid"><label>What do you need to remember?<input id="q_title" placeholder="e.g. Renew insurance policy"></label><label>Area<select id="q_category"></select></label><label>Priority<select id="q_priority"></select></label><label>When to start?<select id="q_horizon"></select></label><label>Reminder Date<input id="q_reminder" type="date"></label><label>Status<select id="q_status"></select></label><label>Est. Minutes<input id="q_minutes" type="number" min="0" step="5" placeholder="30"></label><label>Next Action<input id="q_next" placeholder="First concrete step"></label></div><label>Notes<textarea id="q_notes" placeholder="Why, context, next action, whom to ask, etc."></textarea></label><div class="actionrow"><button id="saveQuick">Save to Workplace</button><button class="ghost" id="cancelQuick">Cancel</button></div></div></div>

<template id="dashboardTpl"><div class="hero"><div><span class="eyebrow">SAO WORKPLACE • OFFICE • HOME • LIFE</span><h2>One dashboard for everything you must not forget.</h2><p>Capture sudden ideas, decide when to start them, set priority, monitor status, and review responsibilities across work, study, clinic, family, health, spirituality, finance and travel.</p><div class="actionrow"><button onclick="app.openQuickAdd()">+ Capture New Task</button><button class="ghost" onclick="app.showView('summary')">Open Master Summary</button></div></div><div class="focus-card"><span>Today's Focus</span><b id="todayFocusCount">0</b><small>items needing attention</small><div id="todayTop3"></div></div></div><div id="dashKpis" class="kpis"></div>
<div class="card main-workspaces-card">
  <div class="cardhead"><div><span class="eyebrow">YOUR FOUR MAIN WORK AREAS</span><h3>Focused Workspaces</h3><p class="muted">Open one area and plan only what belongs there.</p></div></div>
  <div id="mainWorkspaceButtons" class="main-workspace-grid"></div>
</div>
<div class="grid2"><div class="card"><div class="cardhead"><div><h3>Today / Immediate Attention</h3><p class="muted">Urgent, overdue, start-today and reminders due.</p></div><button class="ghost" onclick="app.showView('tasks')">Open Tasks</button></div><div id="todayList"></div></div><div class="card"><div class="cardhead"><div><h3>Upcoming Horizon</h3><p class="muted">Tomorrow → week → month → long-term ideas.</p></div></div><div id="horizonBoard"></div></div></div><div class="grid2"><div class="card"><h3>Priority Distribution</h3><canvas id="priorityChart" width="900" height="340"></canvas></div><div class="card"><h3>Area Overview</h3><div id="areaOverview"></div></div></div><div class="grid2"><div class="card"><div class="cardhead"><h3>Study Queue</h3><button class="ghost" onclick="app.showView('study')">Study Planner</button></div><div id="studyQueue"></div></div><div class="card"><div class="cardhead"><h3>Wellness & Sadhana Today</h3><button class="ghost" onclick="app.showView('wellness')">Open Tracker</button></div><div id="wellnessToday"></div></div></div></template>


<template id="workspaceTpl">
  <div class="workspace-hero" id="workspaceHero"></div>
  <div id="workspaceKpis" class="kpis"></div>
  <div class="grid2">
    <div class="card"><div class="cardhead"><div><h3>Needs Attention</h3><p class="muted">Red priority, today, overdue and reminders.</p></div><button id="workspaceQuickAdd">+ Add Here</button></div><div id="workspaceAttention"></div></div>
    <div class="card"><div class="cardhead"><div><h3>Upcoming Plan</h3><p class="muted">Tomorrow, next week and longer horizons.</p></div></div><div id="workspaceUpcoming"></div></div>
  </div>
  <div class="card"><div class="cardhead"><div><h3>All Open Work in This Area</h3><p class="muted">Edit, complete or share directly.</p></div><button class="ghost" onclick="app.showView('dashboard')">← Main Dashboard</button></div><div id="workspaceTasks"></div></div>
  <div id="workspaceExtra"></div>
</template>
<template id="tasksTpl"><div class="card"><div class="cardhead"><div><span class="eyebrow">TASKS • PROJECTS • RESPONSIBILITIES</span><h3>Work & Project Planner</h3><p class="muted">From sudden ideas to one-year plans — nothing gets lost.</p></div><button id="newTaskBtn">+ New Task / Project</button></div><div class="toolbar"><input id="taskSearch" placeholder="Search task / project / person / tag"><select id="taskCategoryFilter"><option value="">All Areas</option></select><select id="taskPriorityFilter"><option value="">All Priority</option></select><select id="taskStatusFilter"><option value="">All Status</option></select><select id="taskHorizonFilter"><option value="">All Start Horizons</option></select></div><div id="taskKpis" class="kpis compact"></div><div id="tasksList"></div></div><div id="taskEditor"></div></template>
<template id="studyTpl"><div class="grid2"><div class="card"><div class="cardhead"><div><span class="eyebrow">LEARN • REVIEW • MASTER</span><h3>Study Planner</h3><p class="muted">Plan topics, sources, slots and completion.</p></div><button id="newStudyBtn">+ Add Study Topic</button></div><div id="studyEditor"></div></div><div class="card"><div class="cardhead"><h3>Study Queue</h3><select id="studyStatusFilter"><option value="">All Status</option></select></div><div id="studyList"></div></div></div></template>
<template id="wellnessTpl"><div class="card"><div class="cardhead"><div><span class="eyebrow">BODY • MIND • SADHANA • SEVA</span><h3>Wellness & Spiritual Tracker</h3><p class="muted">Daily habits, Radha Naam japa, mala, pooja, vrata, yoga, exercise, sleep, diet and dana.</p></div><input id="wellnessDate" type="date"></div><div id="wellnessForm"></div></div><div class="grid2"><div class="card"><h3>Monthly Totals</h3><div id="wellnessTotals"></div></div><div class="card"><h3>Recent Logs</h3><div id="wellnessHistory"></div></div></div></template>
<template id="travelTpl"><div class="grid2"><div class="card"><div class="cardhead"><div><span class="eyebrow">SEMINAR • YATRA • TOUR</span><h3>Travel & Seminar Planner</h3><p class="muted">Purpose, tickets, companions, nearby places, timing and budget.</p></div><button id="newTravelBtn">+ New Plan</button></div><div id="travelEditor"></div></div><div class="card"><div class="cardhead"><h3>Upcoming Plans</h3><select id="travelStatusFilter"><option value="">All Status</option></select></div><div id="travelList"></div></div></div></template>

<template id="mydayTpl">
  <div class="hero myday-hero">
    <div><span class="eyebrow">TODAY • FOCUS • TIME BLOCKS</span><h2>My Day</h2><p>Choose the few things that matter most today. See overdue work, reminders and realistic time demand in one screen.</p></div>
    <div class="focus-card"><span>Planned Workload</span><b id="myDayMinutes">0</b><small>minutes estimated today</small></div>
  </div>
  <div id="myDayKpis" class="kpis"></div>
  <div class="grid2">
    <div class="card"><div class="cardhead"><div><h3>Top Focus</h3><p class="muted">Star up to 3 important tasks.</p></div><button class="ghost" onclick="app.openQuickAdd()">+ Add</button></div><div id="focusList"></div></div>
    <div class="card"><h3>Today's Agenda</h3><div id="agendaList"></div></div>
  </div>
  <div class="grid2"><div class="card"><h3>Overdue / Needs Rescue</h3><div id="rescueList"></div></div><div class="card"><h3>Waiting / Help Needed</h3><div id="waitingList"></div></div></div>
</template>

<template id="boardTpl">
  <div class="card"><div class="cardhead"><div><span class="eyebrow">KANBAN VIEW</span><h3>Status Board</h3><p class="muted">Move work mentally from idea → action → waiting → done.</p></div><select id="boardArea"><option value="">All Areas</option></select></div><div id="kanbanBoard" class="kanban"></div></div>
</template>

<template id="reviewTpl">
  <div class="card"><div class="cardhead"><div><span class="eyebrow">DAILY • WEEKLY • MONTHLY REVIEW</span><h3>Review Center</h3><p class="muted">Find forgotten, overdue, waiting, blocked and long-term work before it disappears from attention.</p></div><button id="reviewRefresh">Refresh Review</button></div><div id="reviewKpis" class="kpis"></div></div>
  <div class="grid2"><div class="card"><h3>Overdue</h3><div id="reviewOverdue"></div></div><div class="card"><h3>Stale / Forgotten</h3><div id="reviewStale"></div></div></div>
  <div class="grid2"><div class="card"><h3>Waiting / Need Help</h3><div id="reviewWaiting"></div></div><div class="card"><h3>Long-Term Parking</h3><div id="reviewLong"></div></div></div>
  <div class="card"><div class="cardhead"><h3>Weekly Reflection</h3><button id="saveReflection">Save Reflection</button></div><div class="formgrid"><label>What went well?<textarea id="rv_good"></textarea></label><label>What got stuck?<textarea id="rv_stuck"></textarea></label><label>Top 3 priorities for next week<textarea id="rv_next"></textarea></label></div><div id="reflectionHistory"></div></div>
</template>
<template id="summaryTpl"><div class="card"><div class="cardhead"><div><span class="eyebrow">ONE PAGE LIFE REVIEW</span><h3>Master Summary</h3><p class="muted">Everything summarized by urgency, area, horizon and status.</p></div><div class="actionrow"><button id="printSummary">Print / Save PDF</button><button class="ghost" id="shareSummary">Share</button></div></div><div id="masterSummary"></div></div></template>
<template id="filesTpl"><div class="grid2"><div class="card"><h3>Files, Images, PDFs & Notes</h3><div class="formgrid"><label>Area<select id="fileCategory"></select></label><label>Linked Task / Project<select id="fileTask"><option value="">General / not linked</option></select></label><label>Note<input id="fileNote" placeholder="What is this file?"></label></div><label class="uploadbox">📎 Add Image / PDF / Document<input id="fileInput" type="file" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt"></label><div id="pickedFiles"></div><button id="saveFiles">Save Files</button></div><div class="card"><div class="cardhead"><h3>Saved Files</h3><select id="fileFilter"><option value="">All Areas</option></select></div><div id="filesList"></div></div></div></template>
<template id="backupTpl"><div class="card"><h3>Backup, Restore & Export</h3><p class="muted">Keep a backup before major changes or switching devices.</p><div class="actionrow"><button id="backupBtn">Download JSON Backup</button><label class="buttonlike">Restore JSON<input type="file" id="restoreInput" accept=".json" hidden></label><button class="ghost" id="csvBtn">Export Tasks CSV</button></div></div></template>
<template id="settingsTpl"><div class="card"><h3>Workplace Settings</h3><div id="settingsForm"></div></div><div class="card"><h3>Reminder Permission</h3><p class="muted">In-app reminders work whenever the app is opened. Browser notifications can also appear while the app is active if permission is granted.</p><button id="notificationBtn">Enable Notifications</button><div id="notificationState" class="note"></div></div></template>
<script src="app.js?v=2.2.0"></script>
</body>
</html>
